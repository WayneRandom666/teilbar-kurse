name: BAZG-Tageskurse

on:
  schedule:
    # Werktags; das BAZG veröffentlicht am Morgen. Zeiten in UTC (06:20 und 09:20 UTC = 08:20 / 11:20 Sommerzeit).
    - cron: "20 6 * * 1-5"
    - cron: "20 9 * * 1-5"
  workflow_dispatch:
    inputs:
      publish:
        description: "Auch ohne neue Kurse auf npm veröffentlichen"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write   # npm Trusted Publishing (ohne gespeichertes Token)

concurrency:
  group: kurse
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions pinned to a commit (supply chain); update deliberately
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - name: Kurse holen
        run: node scripts/bazg.mjs
      - name: Speichern
        id: save
        run: |
          if git diff --quiet -- kurse.json kurse.mjs && git ls-files --error-unmatch kurse.json >/dev/null 2>&1; then
            echo "Nichts Neues"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kurse.json kurse.mjs
          git commit -m "Kurse $(node -p "require('./kurse.json').date")"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Auf npm veröffentlichen
        if: steps.save.outputs.changed == 'true' || inputs.publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install -g npm@11.21.0 >/dev/null   # trusted publishing needs npm >= 11.5.1; pinned on purpose
          D=$(node -p "require('./kurse.json').date.replaceAll('-', '')")
          npm version --no-git-tag-version "0.${D}.${GITHUB_RUN_NUMBER}${GITHUB_RUN_ATTEMPT}"
          npm publish --access public
      - name: jsDelivr-Zwischenspeicher leeren
        if: steps.save.outputs.changed == 'true' || inputs.publish
        run: |
          sleep 30
          for u in npm/teilbar-kurse@latest/kurse.json npm/teilbar-kurse@latest/kurse.json/+esm npm/teilbar-kurse@latest/kurse.mjs; do
            curl -fsS "https://purge.jsdelivr.net/$u" >/dev/null || echo "Purge $u fehlgeschlagen (nicht schlimm)"
          done
