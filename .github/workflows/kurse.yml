name: BAZG-Tageskurse

on:
  schedule:
    # Werktags; das BAZG veröffentlicht am Morgen. Zeiten in UTC (06:20 und 09:20 UTC = 08:20 / 11:20 Sommerzeit).
    - cron: "20 6 * * 1-5"
    - cron: "20 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kurse
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kurse holen
        run: node scripts/bazg.mjs
      - name: Speichern
        run: |
          if git diff --quiet -- kurse.json kurse.mjs && git ls-files --error-unmatch kurse.json >/dev/null 2>&1; then
            echo "Nichts Neues"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kurse.json kurse.mjs
          git commit -m "Kurse $(node -p "require('./kurse.json').date")"
          git push
      - name: jsDelivr-Zwischenspeicher leeren
        run: |
          for f in kurse.mjs kurse.json; do
            curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/$f" >/dev/null || echo "Purge $f fehlgeschlagen (nicht schlimm)"
          done
